name: TaskService V2 validation
on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/taskservice-v2.yml'
  push:
    branches: ['codex/taskservice-v2-core']
    paths: ['v2/**', '.github/workflows/taskservice-v2.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TASKSERVICE_TEST_ADMIN_DB: Host=127.0.0.1;Port=5432;Username=postgres;Password=local-ci-only;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - run: npm ci --prefix v2/web
      - run: npm run --prefix v2/web test:access
      - run: npm run --prefix v2/web build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.62.0'
      - run: python -m playwright install --with-deps chromium
      - run: dotnet test v2/tests/TaskService.Tests.csproj --configuration Release
        env:
          TASKSERVICE_GUEST_BROWSER: ${{ github.workspace }}/v2/tests/guest_browser.py
          TASKSERVICE_REPORT_BROWSER: ${{ github.workspace }}/v2/tests/report_browser.py
          TASKSERVICE_INVOICE_BROWSER: ${{ github.workspace }}/v2/tests/invoice_browser.py
          TASKSERVICE_BROWSER_WEBROOT: ${{ github.workspace }}/v2/web/dist
          TASKSERVICE_BROWSER_OUTPUT: ${{ runner.temp }}/taskservice-browser
      - name: Restore a disposable PostgreSQL backup
        run: bash v2/ops/restore-smoke.sh
        env:
          TASKSERVICE_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm audit --prefix v2/web --audit-level=high
      - run: docker build -f v2/Dockerfile -t taskservice:ci .
      - name: Verify the isolated deployment configuration
        run: bash v2/ops/compose-smoke.sh
