Foreground yes
User clamav
TCPAddr 0.0.0.0
TCPSocket 3310
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
MaxThreads 1
# Avoid double-engine memory during database refresh; scanning pauses briefly.
ConcurrentDatabaseReload no
MaxQueue 4
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 40M
AlertEncrypted yes
AlertExceedsMax yes
